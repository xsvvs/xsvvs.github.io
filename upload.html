<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop and share</title>
<style>
:root{
  --bg:#eef1f6;--panel:#ffffff;--ink:#1a2030;--muted:#5d6779;--line:#c3cbdb;
  --accent:#2f4bff;--accent-ink:#ffffff;--ok:#12805c;--err:#c0262d;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151d;--panel:#1b2030;--ink:#e8ecf5;--muted:#9aa4b8;--line:#39425a;
    --accent:#8a98ff;--accent-ink:#10131c;--ok:#4cd6a2;--err:#ff7b80;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;padding:32px 16px;
}
main{width:100%;max-width:640px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{margin:0 0 20px;color:var(--muted)}

#drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:240px;padding:24px;text-align:center;cursor:pointer;
  background:var(--panel);border:2px dashed var(--line);border-radius:16px;
  transition:border-color .15s,background .15s;
}
#drop:hover,#drop:focus-visible,#drop.over{border-color:var(--accent);outline:none}
#drop.over{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
#drop strong{font-size:1.35rem}
#drop span{color:var(--muted)}
#file{display:none}

details{margin:16px 0}
summary{cursor:pointer;color:var(--muted)}
summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:grid;gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=password]{
  font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
.row3{display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:10px}
@media (max-width:520px){.row3{grid-template-columns:1fr}}

#list{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.item{
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;
}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--bg)}
.meta{min-width:0}
.meta a,.meta .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.meta a{color:var(--accent)}
.status{font-size:.85rem;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
button.copy{
  font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;
  padding:8px 14px;background:var(--accent);color:var(--accent-ink);
}
button.copy:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){#drop{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Drop and share</h1>
  <p class="sub">Drop an image or GIF. It’s saved to your site, and you get a link that embeds on Discord.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Choose images to upload">
    <strong>Drop images or GIFs here</strong>
    <span>or click to choose, or paste with Ctrl+V</span>
  </div>
  <input id="file" type="file" accept="image/*" multiple>

  <details id="settings">
    <summary>Settings</summary>
    <div class="fields">
      <label>GitHub token (stays in this browser only)
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      </label>
      <div class="row3">
        <label>Owner <input id="owner" type="text" autocomplete="off"></label>
        <label>Repo <input id="repo" type="text" autocomplete="off"></label>
        <label>Branch <input id="branch" type="text" autocomplete="off"></label>
      </div>
    </div>
  </details>

  <ul id="list"></ul>
</main>

<script>
const $ = (s) => document.querySelector(s);
const DEFAULTS = { owner: "xsvvs", repo: "xsvvs.github.io", branch: "main", token: "" };
const MAX_BYTES = 25 * 1024 * 1024;

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem("up_" + k); localStorage.setItem("up_" + k, v); }
  catch (e) { return null; }
}
function cfg() {
  const c = {};
  for (const k in DEFAULTS) c[k] = (store(k) || DEFAULTS[k]).trim();
  return c;
}
for (const k in DEFAULTS) {
  const el = $("#" + k);
  el.value = store(k) || DEFAULTS[k];
  el.addEventListener("input", () => store(k, el.value));
}

function siteBase(c) {
  return c.repo.toLowerCase() === c.owner.toLowerCase() + ".github.io"
    ? "https://" + c.repo
    : "https://" + c.owner + ".github.io/" + c.repo;
}

function safeName(n) {
  const i = n.lastIndexOf(".");
  const base = i > 0 ? n.slice(0, i) : n;
  const ext = i > 0 ? n.slice(i).toLowerCase() : "";
  const clean = base.normalize("NFKD").replace(/[^\w\- ]+/g, "").trim()
    .replace(/\s+/g, "-").slice(0, 60) || "image";
  return clean + ext;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = () => reject(new Error("Couldn’t read the file"));
    r.readAsDataURL(file);
  });
}

function put(c, path, b64) {
  return fetch(
    "https://api.github.com/repos/" + c.owner + "/" + c.repo + "/contents/" + encodeURIComponent(path),
    {
      method: "PUT",
      headers: {
        Authorization: "Bearer " + c.token,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
      },
      body: JSON.stringify({ message: "Upload " + path, content: b64, branch: c.branch }),
    }
  );
}

function addRow(file) {
  const li = document.createElement("li");
  li.className = "item";
  const img = document.createElement("img");
  img.alt = "";
  img.src = URL.createObjectURL(file);
  const meta = document.createElement("div");
  meta.className = "meta";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = file.name;
  const status = document.createElement("span");
  status.className = "status";
  status.textContent = "Waiting";
  meta.append(name, status);
  const btn = document.createElement("button");
  btn.className = "copy";
  btn.textContent = "Copy link";
  btn.disabled = true;
  li.append(img, meta, btn);
  $("#list").prepend(li);
  return { name, status, btn };
}

async function upload(file, row) {
  const c = cfg();
  if (!file.type.startsWith("image/")) return fail(row, "Not an image file");
  if (file.size > MAX_BYTES) return fail(row, "Too large (25 MB max)");

  row.status.textContent = "Uploading…";
  try {
    const b64 = await toBase64(file);
    let fname = safeName(file.name);
    let res;
    for (let attempt = 0; attempt < 4; attempt++) {
      res = await put(c, fname, b64);
      if (res.status !== 422) break;
      const dot = fname.lastIndexOf(".");
      const stem = safeName(file.name).replace(/\.[^.]*$/, "");
      const ext = dot > 0 ? fname.slice(dot) : "";
      fname = stem + "-" + Math.random().toString(36).slice(2, 6) + ext;
    }
    if (!res.ok) {
      if (res.status === 401) return fail(row, "Token rejected. Check it in Settings.");
      if (res.status === 403 || res.status === 404)
        return fail(row, "No write access. The token needs Contents: read and write on this repo.");
      const body = await res.json().catch(() => ({}));
      return fail(row, body.message || "Upload failed (" + res.status + ")");
    }
    const link = siteBase(c) + "/" + fname;
    row.name.replaceWith(Object.assign(document.createElement("a"), {
      className: "name", href: link, target: "_blank", rel: "noopener", textContent: link,
    }));
    row.status.textContent = "Uploaded. Live in about a minute.";
    row.status.className = "status ok";
    row.btn.disabled = false;
    row.btn.onclick = async () => {
      await navigator.clipboard.writeText(link);
      row.btn.textContent = "Copied";
      setTimeout(() => (row.btn.textContent = "Copy link"), 1500);
    };
  } catch (e) {
    fail(row, e.message || "Upload failed");
  }
}

function fail(row, msg) {
  row.status.textContent = msg;
  row.status.className = "status err";
}

let queue = Promise.resolve();
function handleFiles(files) {
  const list = Array.from(files);
  if (!list.length) return;
  if (!cfg().token) {
    $("#settings").open = true;
    $("#token").focus();
    return;
  }
  // One at a time: parallel commits to the same branch can collide.
  for (const f of list) {
    const row = addRow(f);
    queue = queue.then(() => upload(f, row));
  }
}

const drop = $("#drop");
drop.addEventListener("click", () => $("#file").click());
drop.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); }
});
$("#file").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
["dragenter", "dragover"].forEach((t) =>
  drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) =>
  drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
document.addEventListener("paste", (e) => {
  if (e.target.tagName === "INPUT") return;
  handleFiles(e.clipboardData.files);
});
// Stop the browser from opening a file dropped outside the drop zone.
["dragover", "drop"].forEach((t) => window.addEventListener(t, (e) => e.preventDefault()));
</script>
</body>
</html>
